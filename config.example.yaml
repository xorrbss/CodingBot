# CodingBot 설정 예시. ~/.codingbot/config.yaml로 복사하여 사용.
enabled: true
time_limit_minutes: 30
max_cycles_per_run: 50
judge_model: "claude-haiku-4-5-20251001"
# LLM judge call timeout (seconds). 0 또는 음수면 timeout 없이 호출.
judge_timeout_secs: 15
api_key_env: "ANTHROPIC_API_KEY"
safe_tools:
  - Read
  - Glob
  - Grep
  - TodoWrite
risky_patterns:
  - "rm -rf"
  - "git push --force"
  - "git push -f"
  - "git reset --hard"
  - "DROP TABLE"
  - "DROP DATABASE"
  - ":(){:|:&};:"
  - "mkfs"
  - "dd if="
# 새 카테고리 매처 on/off (0.2.0+).
# secret: .env/ssh/aws creds/$API_KEY 등 노출 위험
# install: pip/npm/apt/brew install
# priv: sudo/chmod 777/chown root 등 권한 상승
risky_categories:
  secret: true
  install: true
  priv: true
log_level: info
